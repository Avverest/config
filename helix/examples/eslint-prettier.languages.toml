# ═══════════════════════════════════════════════════════════════════════
# ПРИМЕР: eslint + prettier для рабочих проектов
#
# Этот файл Helix НЕ читает. Он лежит здесь как шпаргалка.
# Из ~/.config/helix/ читаются только config.toml и languages.toml.
#
# Использование: скопировать нужные блоки в корень проекта:
#   mkdir -p <project>/.helix
#   cp ~/.config/helix/examples/eslint-prettier.languages.toml \
#      <project>/.helix/languages.toml
#
# Локальный .helix/languages.toml мержится ПОВЕРХ глобального,
# блоки с тем же `name` побеждают. Глобальный дефолт — biome
# (личные проекты), здесь он перекрывается на eslint+prettier.
#
# Не забыть добавить .helix в .gitignore, если это не общая
# договорённость команды.
# ═══════════════════════════════════════════════════════════════════════

# ─── ГРАБЛИ, на которые уже наступали ─────────────────────────────────
#
# 1. НЕ дублировать [[language]] с одним `name`, надеясь, что Helix
#    выберет нужный по `roots`. Он так НЕ работает: блоки мержатся,
#    побеждает последний — глобально, во всех проектах сразу.
#    `roots` = только определение корня workspace для LSP,
#    это НЕ условие применения конфига.
#    Разделение по проектам делается локальным .helix/languages.toml.
#
# 2. `formatter` ПЕРЕКРЫВАЕТ форматирование через LSP. Если задан
#    prettier — biome/eslint formatting уже не вызовется, даже если
#    сервер подключён.
#
# 3. Команда форматтера ищется в $PATH. prettier обычно локальная
#    devDependency и глобально НЕ установлен → голый
#    `command = "prettier"` тихо не сработает, `:format` просто
#    ничего не сделает без ошибки. Отсюда npx ниже.
#    Проверять: `hx --health tsx` → строка `Configured formatter`.
#
# 4. `except-features = ["format"]` у typescript-language-server
#    обязателен, иначе tsserver дерётся за форматирование с prettier.
# ──────────────────────────────────────────────────────────────────────

[[language]]
name = "typescript"
roots = ["package.json", ".eslintrc", ".eslintrc.json", "eslint.config.mjs"]
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "eslint",
]
formatter = { command = "npx", args = ["prettier", "--parser", "typescript"] }
auto-format = false

[[language]]
name = "tsx"
roots = ["package.json", ".eslintrc", ".eslintrc.json", "eslint.config.mjs"]
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "eslint",
]
formatter = { command = "npx", args = ["prettier", "--parser", "typescript"] }
auto-format = false

[[language]]
name = "javascript"
roots = ["package.json", ".eslintrc", ".eslintrc.json", "eslint.config.mjs"]
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "eslint",
]
formatter = { command = "npx", args = ["prettier", "--parser", "babel"] }
auto-format = false

[[language]]
name = "jsx"
roots = ["package.json", ".eslintrc", ".eslintrc.json", "eslint.config.mjs"]
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "eslint",
]
formatter = { command = "npx", args = ["prettier", "--parser", "babel"] }
auto-format = false

