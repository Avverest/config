# ─── Vue ──────────────────────────────────────────────────────────────
# Глобальный блок vue уже использует prettier, но с голой командой —
# в проекте с локальным prettier нужен npx:
#
# [[language]]
# name = "vue"
# formatter = { command = "npx", args = ["prettier", "--parser", "vue"] }
# auto-format = false
# language-servers = ["typescript-language-server", "scls"]

# ─── ПРОВЕРКА ─────────────────────────────────────────────────────────
#
#   cd <project> && hx --health tsx
#
# Ожидается:
#   ✓ typescript-language-server: /opt/homebrew/bin/vtsls
#   ✓ eslint: /opt/homebrew/bin/vscode-eslint-language-server
#   Configured formatter: npx    ← НЕ "None"
#
# `Configured formatter: None` = блок не подхватился или команда
# не найдена в $PATH.
#
# Если prettier всё же не отрабатывает — проверить руками из корня
# проекта, что он вообще установлен:
#   npx prettier --version
#
# Установлено глобально на этой машине (на 2026-08-19):
#   vscode-eslint-language-server  /opt/homebrew/bin/  ✓
#   vtsls                          /opt/homebrew/bin/  ✓
#   biome                          ~/Library/pnpm/bin/ ✓
#   prettier                       ОТСУТСТВУЕТ → только npx
#   eslint (cli)                   ОТСУТСТВУЕТ → только npx
# ──────────────────────────────────────────────────────────────────────
