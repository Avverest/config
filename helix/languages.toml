# Js/Ts
[language-server.typescript-language-server]
command = "vtsls"
args = ["--stdio"]
config.hostInfo = "helix"

[language-server.typescript-language-server.config.typescript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
format.enable = false
format.semicolons = "remove"
preferences.importModuleSpecifier = "non-relative"
preferences.importModuleSpecifierEnding = "auto"
tsserver.pluginPaths = ["typescript-plugin-css-modules", "./node_modules"]

[language-server.typescript-language-server.config.javascript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
format.enable = false
format.semicolons = "remove"
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.enumMemberValues.enabled = true
preferences.importModuleSpecifier = "non-relative"
preferences.importModuleSpecifierEnding = "auto"
tsserver.pluginPaths = ["typescript-plugin-css-modules", "./node_modules"]

[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

[language-server.vscode-css-language-server.config.css]
validate = true
lint = { unknownAtRules = "ignore" }

[language-server.vscode-css-language-server.config.scss]
validate = true
lint = { unknownAtRules = "ignore" }

[language-server.vscode-css-language-server.config.less]
validate = true
lint = { unknownAtRules = "ignore" }

[language-server.emmet-ls]
command = "emmet-language-server"
args = ["--stdio"]

[language-server.scls]
command = "simple-completion-language-server"

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]
required-root-patterns = ["package.json", "*.css"]

[language-server.eslint.config]
codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }
format = { enable = true }
nodePath = ""
quiet = false
rulesCustomizations = []
run = "onType"
validate = "on"
experimental = {}
problems = { shortenToSingleLine = false }

[language-server.eslint.config.codeAction]
disableRuleComment = { enable = true, location = "separateLine" }
showDocumentation = { enable = false }

[[language]]
name = "javascript"
roots = ["biome.json", "biome.jsonc", "package.json"]
indent = { tab-width = 2, unit = "  " }
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome", "tailwindcss-ls", "emmet-ls" ]
auto-format = false

[[language]]
name = "jsx"
roots = ["biome.json", "biome.jsonc", "package.json"]
indent = { tab-width = 2, unit = "  " }
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome", "tailwindcss-ls", "emmet-ls" ]
auto-format = false

[[language]]
name = "typescript"
roots = ["biome.json", "biome.jsonc", "package.json"]
indent = { tab-width = 2, unit = "  " }
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome", "tailwindcss-ls"]
auto-format = false

[[language]]
name = "tsx"
auto-format = false
indent = { tab-width = 2, unit = "  " }
roots = ["biome.json", "biome.jsonc", "package.json"]
language-servers = [{ name = "typescript-language-server", except-features = [ "format" ] }, "biome", "tailwindcss-ls", "emmet-ls"]
# sT/sJ

# Html
[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "tailwindcss-ls", "emmet-ls"]
# lmtH

# Css
[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls", "emmet-ls"]
# ssC

# Json
[[language]]
name = "json"
auto-format = false
language-servers = ["vscode-json-language-server"]
# nosJ

# Vue
[[language]]
name = "vue"
auto-format = false
formatter = { command = "npx", args = ["prettier", "--parser", "vue"] }
language-servers = ["typescript-language-server", "emmet-ls", "scls"] # Emmet + snippet completion for the last 2

[[language-server.typescript-language-server.config.plugins]]
name = "@vue/typescript-plugin"
location = "/Users/averest/.nvm/versions/node/v22.19.0/lib/node_modules/@vue/typescript-plugin"
languages = ["vue"]
# euV

# Go
[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
# oG

# Dart
[language-server.dart]
command = 'dart'
args = ['language-server', '--client-id=helix']

[language-server.dart.config]
closingLabels = true
documentation = 'summary'
# traD

# ZK http://github.com/zk-org/zk
[language-server.zk]
command = "zk"
args = ["lsp"]

[[language]]
name = "markdown"
roots = [".zk"]
language-servers = ["zk"]
# KZ

[language-server.godot]
command = "nc"
args = [ "127.0.0.1", "6005"]

[[language]]
name = "gdscript"
language-servers = [ "godot" ]
