# kak-tree-sitter — user configuration.
#
# This file is MERGED with the binary's built-in defaults, so it only needs to
# carry deltas. (It previously held a verbatim copy of the defaults, which
# pinned every grammar to that snapshot and hid upstream updates.)
# See the full default set with: ktsctl default-config

# ── TSX ───────────────────────────────────────────────────────────────────────
# Upstream's default maps `language.tsx` onto the `typescript` grammar, which is
# tree-sitter-typescript's *non-JSX* grammar (path "typescript/src"). It cannot
# parse JSX, so every `<Component />` in a .tsx file highlights as a comparison
# operator and the tsx textobject/injection queries never match.
#
# tree-sitter-typescript ships a second grammar under "tsx/src" that does handle
# JSX. Build it as its own grammar and point `language.tsx` at it.
#
# (`jsx` needs no such fix: JSX is part of the base tree-sitter-javascript
# grammar, so upstream's `language.jsx -> grammar javascript` is already right.)

[grammar.tsx.source.git]
url = "https://github.com/tree-sitter/tree-sitter-typescript"
pin = "b1bf4825d9eaa0f3bdeb1e52f099533328acfbdf"

[grammar.tsx]
path = "tsx/src"
compile_args = ["-c", "-fpic", "../scanner.c", "../parser.c", "-I", ".."]
link_args = ["-shared", "-fpic", "scanner.o", "parser.o", "-o", "tsx.so"]

[language.tsx]
grammar = "tsx"

[language.tsx.queries.source.git]
url = "https://git.sr.ht/~hadronized/kak-tree-sitter"
pin = "2e5b7841b70b91cfa1c91fe24d2d9db54b80ae10"
